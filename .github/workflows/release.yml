name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test KodiMCPSharp.slnx -c Release
      - run: >-
          dotnet publish src/KodiMCPSharp/KodiMCPSharp.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -o publish/${{ matrix.rid }}
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=portable -p:DebugSymbols=true
      - name: Verify IIS assets are excluded
        if: startsWith(matrix.rid, 'win-')
        shell: bash
        run: test ! -e "publish/${{ matrix.rid }}/aspnetcorev2_inprocess.dll"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-manual-${GITHUB_RUN_NUMBER}}"
          cd "publish/${{ matrix.rid }}"
          zip -r "../../KodiMCPSharp-${version}-${{ matrix.rid }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: KodiMCPSharp-${{ matrix.rid }}
          path: KodiMCPSharp-*.zip
          retention-days: 3

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: KodiMCPSharp-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: cd release-assets && sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release-assets/*
          --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
