name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore KodiMCPSharp.slnx
      - run: dotnet build KodiMCPSharp.slnx -c Release --no-restore
      - run: dotnet test KodiMCPSharp.slnx -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 3
          if-no-files-found: ignore

  publish-smoke:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: >-
          dotnet publish src/KodiMCPSharp/KodiMCPSharp.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -o artifacts/${{ matrix.rid }}
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=portable -p:DebugSymbols=true
      - uses: actions/upload-artifact@v4
        with:
          name: KodiMCPSharp-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          retention-days: 3
